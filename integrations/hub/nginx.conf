worker_processes 2;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  keepalive_timeout 30;
  server_tokens off;
  server {
    listen 80 default_server;
    server_name m-techlabs.com www.m-techlabs.com localhost;
    root /usr/share/nginx/html;
    # Resolve the optional sidecar per request so nginx still starts when it is absent.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $fleet_tracker_sync_origin http://fleet-control-sync:8081;
    index index.html;
    charset utf-8;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none';" always;
    # Read-only observability. Never proxy Fleet Control/AO command APIs.
    location = /mission-control { return 302 /mission-control/analytics/; }
    location = /mission-control/ { return 302 /mission-control/analytics/; }
    location = /mission-control/analytics/api/projects {
      limit_except GET HEAD { deny all; }
      set $fleet_tracker_static_path /mission-control/analytics/api/projects/index.json;
      proxy_pass_request_headers off;
      proxy_pass_request_body off;
      proxy_set_header Host fleet-control-sync:8081;
      proxy_set_header Connection "";
      proxy_set_header Content-Length "";
      proxy_set_header Accept application/json;
      proxy_redirect off;
      proxy_intercept_errors on;
      error_page 502 504 = @fleet_tracker_export_static;
      proxy_read_timeout 15s;
      proxy_pass $fleet_tracker_sync_origin$request_uri;
    }
    location ~ "^/mission-control/analytics/api/projects/(?<tracker_project>[a-z0-9][a-z0-9-]{0,63})$" {
      limit_except GET HEAD { deny all; }
      set $fleet_tracker_static_path /mission-control/analytics/api/projects/$tracker_project.json;
      proxy_pass_request_headers off;
      proxy_pass_request_body off;
      proxy_set_header Host fleet-control-sync:8081;
      proxy_set_header Connection "";
      proxy_set_header Content-Length "";
      proxy_set_header Accept application/json;
      proxy_redirect off;
      proxy_intercept_errors on;
      error_page 502 504 = @fleet_tracker_export_static;
      proxy_read_timeout 15s;
      proxy_pass $fleet_tracker_sync_origin$request_uri;
    }
    location @fleet_tracker_export_static {
      internal;
      if ($arg_refresh = 1) { return 503; }
      try_files $fleet_tracker_static_path =404;
    }
    location = /mission-control/grafana { return 302 /mission-control/grafana/; }
    location /mission-control/grafana/ {
      proxy_pass http://fleet-grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 60s;
      add_header Cache-Control "private, no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://m-techlabs.com; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }
  }
}
